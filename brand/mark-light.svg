<!--
  This Source Code Form is subject to the terms of the Mozilla Public
  License, v. 2.0. If a copy of the MPL was not distributed with this
  file, You can obtain one at https://mozilla.org/MPL/2.0/.

  The Hammunition Hill mark: the guyed mast on the hill, against the sunset
  disc, lifted straight out of the full logo's own composition.

  Not a shrunk down logo. The full illustration is a sticker, with a lattice
  antenna, guy wires, a radio carrying a button row and a waveform, a bunker
  and a penguin, and at the 26 pixels this sits at in the header all of that is
  mud. A mark that works small is a different drawing with the same identity.

  It is deliberately NOT the HH monogram off the bunker hatch. HH standing on
  its own, in heavy letterforms, is a recognised white supremacist abbreviation
  for a phrase this project wants no part of, and a header mark is exactly the
  context that strips a monogram of everything that would otherwise disambiguate
  it. The antenna carries the same identity, is on the name, and cannot be
  misread.

  The hill has to be clipped to the disc or it escapes into the corners, and a
  version with a full lattice mast lost its bracing to mush below about 24
  pixels. Two shapes, two colours, one horizon: that is the whole budget.

  For light backgrounds. The disc and the horizon are unchanged; only the mast
  and its signal go white, because on a white page the mark is the only thing
  there and amber on purple is a 2.4:1 contrast ratio.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img"
     aria-label="Hammunition Hill">
  <title>Hammunition Hill</title>
  <defs><clipPath id="hh-disc"><circle cx="32" cy="32" r="30"/></clipPath></defs>
  <circle cx="32" cy="32" r="30" fill="#912795"/>
  <path d="M-4 46 Q16 34 32 41 Q48 48 68 39 V68 H-4 Z"
        fill="#2b0b30" clip-path="url(#hh-disc)"/>
  <g stroke="#ffffff" stroke-width="3.5" stroke-linecap="round" fill="none">
    <path d="M32 14 V48"/>
    <path d="M32 26 L21 48 M32 26 L43 48"/>
  </g>
  <g stroke="#ffffff" stroke-width="3" fill="none" stroke-linecap="round">
    <path d="M22 14 A10 10 0 0 1 32 4"/>
    <path d="M15.5 14.5 A17 17 0 0 1 32 -2"/>
  </g>
</svg>

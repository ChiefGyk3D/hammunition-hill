# Hammunition Hill -- example configuration
#
# Copy to config.toml and edit. This file is the only thing that decides what
# the collector contacts; there is no settings API and no write endpoint, so
# nothing reachable over HTTP can change any of it.

[server]
# Loopback by default. Change this only if you understand docs/SECURITY.md:
# there is no authentication, so the network is the access control.
host = "127.0.0.1"
port = 8073

[station]
# Used for bearings, distances, and greyline. Nothing is sent anywhere -- these
# numbers are used on this machine and in your browser, and nowhere else.
callsign = "N0CALL"
grid = "FN04ga"
# Your licence class, used to default the Band Plan panel. If you leave it out,
# it is guessed from US callsign format -- exact for a Group A call (1x2, 2x1,
# or a 2x2 starting with A, which only an Extra may hold) and a best guess
# otherwise, since vanity calls break the mapping. Non-US calls get no guess.
# One of: novice, technician, general, advanced, extra
# license_class = "general"
# lat/lon override the grid if you want more precision than a 6-character square.
# lat = 44.0157
# lon = -79.4591

[log]
# AD1C's country file, if you have one. Without it, callsigns resolve through a
# compact built-in prefix table that is good for common entities and documented
# as approximate. Any logging program you already run probably ships a copy.
# cty_dat = "~/.local/share/hammunition-hill/cty.dat"

[paths]
# Defaults are ./data and ./web relative to this file.
# data_dir = "/var/lib/hammunition-hill"
# web_dir  = "/usr/share/hammunition-hill/web"

# --- Tier 1: sources the collector polls -----------------------------------
# Each one writes /data/<id>.json. Intervals are seconds, floor 30. These are
# free services run by volunteers and public agencies -- do not hammer them.

[[sources]]
id = "hamqsl"
kind = "hamqsl"
url = "https://www.hamqsl.com/solarxml.php"
interval = 900

[[sources]]
id = "kindex"
kind = "swpc"
url = "https://services.swpc.noaa.gov/products/noaa-planetary-k-index.json"
interval = 900
options = { product = "planetary_k_index" }

[[sources]]
id = "solarflux"
kind = "swpc"
url = "https://services.swpc.noaa.gov/json/f107_cm_radio_flux.json"
interval = 3600
options = { product = "f107_flux" }

[[sources]]
id = "xray"
kind = "swpc"
url = "https://services.swpc.noaa.gov/json/goes/primary/xrays-1-day.json"
interval = 600
options = { product = "xray_flux" }

# The OVATION aurora forecast. The raw grid is several megabytes; the collector
# reduces it to the oval boundary and a coarse cell grid before publishing.
[[sources]]
id = "aurora"
kind = "aurora"
url = "https://services.swpc.noaa.gov/json/ovation_aurora_latest.json"
interval = 900

# NOAA's own R/S/G storm scales -- the official reading, alongside our dials.
[[sources]]
id = "scales"
kind = "noaa_scales"
url = "https://services.swpc.noaa.gov/products/noaa-scales.json"
interval = 900

# Watches, warnings and alerts as SWPC issues them.
[[sources]]
id = "alerts"
kind = "swpc_alerts"
url = "https://services.swpc.noaa.gov/products/alerts.json"
interval = 900

# --- Weather at the antenna, not the ionosphere ------------------------------
# Active NWS watches, warnings and advisories. No key and no account.
#
# The filter lives in this URL, and it is the only place it lives -- the source
# builds no URL of its own. Pick exactly one form:
#
#   ?area=CO                  a state or marine area (two letters)
#   ?point=39.74,-104.98      your QTH; the most precise option
#   ?zone=COZ040              a specific NWS forecast zone
#
# Commented out because there is no sensible default: an operator in Colorado
# does not want Florida's alerts, and a wrong guess is worse than nothing.
#
# [[sources]]
# id = "wxalerts"
# kind = "nws_alerts"
# url = "https://api.weather.gov/alerts/active?area=CO"
# interval = 300

[[sources]]
id = "amsat"
kind = "rss"
url = "https://www.amsat.org/feed/"
interval = 3600

[[sources]]
id = "pota"
kind = "pota"
url = "https://api.pota.app/spot/activator"
interval = 120

[[sources]]
id = "sota"
kind = "sota"
url = "https://api2.sota.org.uk/api/spots/50/all"
interval = 120

# Any iCalendar feed. Verify the URL before relying on it -- contest calendars
# move, and the right one for you may be regional or club-specific.
# [[sources]]
# id = "contests"
# kind = "ics"
# url = "https://www.contestcalendar.com/calendar.ics"
# interval = 21600
# options = { label = "Contests", horizon_days = 21 }

# --- Streams: long-lived connections ----------------------------------------
# These hold a socket open rather than polling. They emit only; nothing they
# receive can change what the collector fetches or from where.

# A DX cluster needs a real callsign to log in -- clusters do not accept
# anonymous connections, and node operators can and do ban abusive clients.
# [[sources]]
# id = "cluster"
# kind = "dxcluster"
# url = "telnet://dxc.nc7j.com:7373"
# options = { callsign = "N0CALL", commands = ["set/name Chief", "set/ft8"] }

# --- Local: read from this disk, never the network ---------------------------
# The log is the feature no hosted dashboard can match. Point this at your ADIF
# export and spots get coloured by what you still need.
# [[sources]]
# id = "log"
# kind = "adif"
# path = "~/logs/mylog.adi"
# interval = 300

# WSJT-X: enable Settings -> Reporting -> UDP Server. Listen-only.
# [[sources]]
# id = "wsjtx"
# kind = "wsjtx"
# url = "udp://127.0.0.1:2237"
# local = true

# Hamlib rigctld. Read-only: the client sends two get commands and has no code
# path that could change frequency, mode, or PTT.
# [[sources]]
# id = "rig"
# kind = "rigctl"
# url = "tcp://127.0.0.1:4532"
# local = true
# options = { poll_seconds = 1.0 }

# A source pointing at your own LAN must say so. Without `local = true` the
# egress guard refuses any host that resolves to a private or loopback address,
# which is what stops a mistyped or hijacked upstream URL from probing your
# network.
#
# [[sources]]
# id = "pistar"
# kind = "rss"
# url = "http://pi-star.local/feed.xml"
# interval = 300
# local = true

# --- Logbooks ---------------------------------------------------------------
# Plain ADIF files this appends to. No database, no lock-in: the same file opens
# in any logger, and the needed-slot spot colouring reads it back, so working a
# new entity here stops the spot list calling it new on the next cycle.
#
# The primary logbook is the one that drives that colouring.
#
# [[logbooks]]
# id = "main"
# name = "Home station"
# path = "~/logs/main.adi"
# primary = true
#
# [[logbooks]]
# id = "kx2"
# name = "KX2 portable"
# path = "~/logs/portable.adi"
# station_callsign = "N0CALL/P"

# Logging from the dashboard is the one place the server accepts input, so it is
# off by default. It is append-only -- no edit, no delete -- and defended against
# cross-site posting and DNS rebinding. See docs/LOGBOOK.md.
# [logging]
# enabled = true

# --- Callsign lookup --------------------------------------------------------
# Off by default. Entity, beam heading, distance, and worked status all work
# without this -- a provider adds name, grid, and licence detail.
#
# Every provider costs something: an account, money, or one request per callsign
# to a third party. Read docs/CALLSIGN-LOOKUP.md before choosing.
#
#   none    prefix table only (default) — nothing leaves the machine
#   callook free, no account, US only
#   hamqth  free, worldwide, needs a HamQTH account
#   qrz     best data, worldwide, needs a paid QRZ XML subscription
#   fcc_uls designed but not built yet — local FCC download, no per-lookup network
#
# Providers are an ordered chain, tried left to right. No single source is right
# for every callsign, so you pick the order:
#
#   providers = ["fcc_uls", "qrz"]
#
# A local-first chain is usually what you want. The offline FCC index answers US
# callsigns instantly with no network at all, and declines everything else for
# free -- so the paid provider behind it only ever sees the calls it is actually
# needed for, and a park with no signal still resolves most of a US pileup.
#
# When the network goes, network providers are skipped rather than waited on,
# and the offline ones carry on. That is automatic; there is no portable mode
# to remember to switch on.
#
# The old singular form still works and means a chain of one:
#   provider = "callook"
#
# [lookup]
# providers = ["fcc_uls", "qrz"]
# username = ""            # hamqth / qrz only
# password = ""            # keep config.toml chmod 600 if you set these
# max_per_cycle = 20       # be a good guest to free services
# cache_hours = 720
# serve_stale = true       # publish expired cache entries, flagged, when offline
# uls_db = ""              # defaults to <data_dir>/fcc_uls.sqlite3
#
# fcc_uls needs a one-off import before it can answer:
#     hamhill fcc-import                 # downloads ~160 MB from the FCC
#     hamhill fcc-import --file l_amat.zip   # if you already have the file
# The FCC rebuilds it weekly; re-running monthly is plenty. `hamhill check`
# tells you how many callsigns are indexed and when.
#
# Resolution is scheduled, not on demand: the collector works through callsigns
# that already appear in your spots and decodes. Looking up arbitrary callsigns
# would need a query endpoint — designed, NOT built. The flag below parses and
# does nothing today; see docs/STATUS.md.
# query_endpoint = false

# --- Tier 2: foreign content the browser loads directly ---------------------
# Empty by default. Every host listed here is added to the page's CSP, and is a
# host your browser then contacts on every dashboard load. Prefer images over
# iframes: an image cannot run script.
[embeds]
allow_hosts = []
# allow_hosts = ["radar.weather.gov", "www.hamqsl.com"]

# --- GPS: automatic grid square when portable --------------------------------
# Off by default. Two ways to read a receiver; prefer gpsd where you have it,
# because it shares the device -- reading the serial line directly takes it
# exclusively, so your logging software will not see it.
#
# WHAT GETS PUBLISHED. A snapshot is readable by everyone on your LAN, and a raw
# fix is your house to a few metres. So the collector truncates to a Maidenhead
# locator before publishing, and that is also all the dashboard needs: bearings,
# distances, the greyline, band-plan region and the propagation model are all
# grid-square work.
#
#   precision = 4   ~70 x 35 miles
#   precision = 6   ~3 x 1.5 miles   (default, and what you print on a QSL card)
#   precision = 8   ~500 x 250 m
#
#   publish_coordinates = true   also publish lat/lon, rounded to match the grid.
#                                Off by default. Turn it on only if you know who
#                                can reach this dashboard.
#   follow = false               show the fix without moving the station. For a
#                                fixed site with a receiver present for its clock
#                                rather than its position.
#
# gpsd -- the recommended path on Linux:
#
# [[sources]]
# id = "gps"
# kind = "gpsd"
# url = "tcp://127.0.0.1:2947"
# local = true
# options = { precision = 6 }
#
# A bare USB receiver with no gpsd. Needs read access to the device -- usually
# membership of the `dialout` group, which is not root-equivalent:
#
# [[sources]]
# id = "gps"
# kind = "nmea"
# path = "/dev/ttyUSB0"
# options = { baud = 9600, precision = 6 }
#
# The panel also shows your clock error against GPS time. It never sets the
# clock -- that needs privileges a dashboard should not have, and chrony or
# gpsd's own PPS handling do it properly.

# --- Tier 2: imagery the browser loads directly ------------------------------
# Radar, satellite and lightning pictures. Empty by default, and read the cost
# before you fill it in.
#
# Unlike everything under [[sources]], the collector never fetches these. Your
# browser does, on every dashboard that shows them. That means the upstream sees
# your IP, your User-Agent, and any cookie it has already set in your browser --
# an <img> is not a CORS request, so it carries them. On a shared shack display
# that is every viewer, not one machine.
#
# The trade is deliberate: a radar mosaic that redraws every two minutes is not
# something a collector can usefully cache, and proxying it would turn a static
# file server into an image relay with an outbound fetch per viewer. But it is a
# trade, so it is opt-in one line at a time and the panel labels every tile.
#
# Hosts here are added to img-src automatically -- you do not also list them
# under [embeds]. They are NOT added to frame-src (an image cannot run script; a
# frame from the same host can) and NOT added to the collector's egress
# allowlist, because the collector has no business reaching them.
#
# A restart is required after editing: the CSP is built at startup.
#
#   id            filename-safe, unique
#   url           https only
#   name          what the tile is labelled
#   group         filter chip it appears under
#   refresh       seconds between reloads; 60s floor, and please be generous
#   credit        who to thank, shown on the tile
#   cache_bust    adds ?_hh=<epoch> so you get the new image, not the cached
#                 one. Turn it off for a host that rejects unknown parameters.
#
# THESE URLS WERE CORRECT WHEN WRITTEN AND WILL ROT. Upstream image endpoints
# get renamed without notice. If a tile says "unavailable", open its URL in a
# browser -- that tells you in one step whether it is the URL or your network.
# Find your local radar's four-letter site ID at https://radar.weather.gov.
#
# [[imagery]]
# id = "radar-conus"
# name = "US radar (CONUS)"
# url = "https://radar.weather.gov/ridge/standard/CONUS_loop.gif"
# group = "radar"
# refresh = 300
# credit = "NOAA/NWS"
#
# [[imagery]]
# id = "radar-local"
# name = "Local radar"
# url = "https://radar.weather.gov/ridge/standard/KFTG_loop.gif"
# group = "radar"
# refresh = 300
# credit = "NOAA/NWS"
#
# [[imagery]]
# id = "goes-east"
# name = "GOES-East geocolor"
# url = "https://cdn.star.nesdis.noaa.gov/GOES19/ABI/CONUS/GEOCOLOR/1250x750.jpg"
# group = "satellite"
# refresh = 900
# credit = "NOAA/NESDIS"

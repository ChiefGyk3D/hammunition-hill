[project]
name = "hammunition-hill"
version = "0.1.0"
description = "Local-first ham radio dashboard with a snapshot architecture and no inbound attack surface"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MPL-2.0" }
authors = [{ name = "ChiefGyk3D" }]
keywords = ["ham-radio", "amateur-radio", "dashboard", "propagation", "space-weather"]

# Dependencies are deliberately minimal, and each one earns its place on
# security grounds:
#   httpx      - explicit timeouts and redirect control, which urllib makes awkward
#   defusedxml - HamQSL serves XML; stock ElementTree is vulnerable to entity attacks
dependencies = ["httpx>=0.27", "defusedxml>=0.7.1"]

[project.optional-dependencies]
# Satellite pass prediction. Optional because the core install should stay at
# two dependencies, and because most of the dashboard does not need it.
#
# sgp4 is the reference implementation of Spacetrack Report #3 as revised in
# 2006 -- the model two-line elements are *defined against*, since a TLE is not
# a state vector but a set of constants fitted for one specific propagator.
# Reimplementing it would be five hundred lines of orbital mechanics that could
# not be verified to the same standard. It has no dependencies of its own.
satellites = ["sgp4>=2.20"]

# PyYAML is test-only: tests/test_workflows.py parses the CI configuration, and
# a hand-rolled reader for a security check is exactly the wrong economy.
# sgp4 is here too so CI always exercises the satellite path rather than
# skipping it -- an optional extra nobody tests is an extra that breaks.
dev = ["pytest>=8.0", "pytest-asyncio>=0.23", "ruff>=0.5", "PyYAML>=6.0", "sgp4>=2.20"]

[project.scripts]
hamhill = "hammunition_hill.cli:main"

[project.urls]
Homepage = "https://github.com/ChiefGyk3D/hammunition-hill"
Companion = "https://github.com/ChiefGyk3D/Hammunition"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
hammunition_hill = ["py.typed"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "S"]
ignore = ["S104"]  # binding 0.0.0.0 is a deliberate, flag-gated choice

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

# CodeQL, gitleaks, a dependency audit and dependency review on pull
# requests. The jobs live in ChiefGyk3D/git-your-ship-together.
name: Security

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '0 6 * * 1'   # weekly, so new advisories surface between commits
  workflow_dispatch:

permissions:
  contents: read

jobs:
  security:
    uses: ChiefGyk3D/git-your-ship-together/.github/workflows/security.yml@0e58a0e61ea8b3800d1cb0e6ed81bb860ace2094 # v1.6.3
    permissions:
      contents: read
      security-events: write
      pull-requests: write
      id-token: write
    secrets:
      DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN }}   # optional Service Token fallback; unset means OIDC only
    with:
      codeql-languages: python,javascript-typescript,actions   # the dashboard under web/ is JavaScript; the old codeql.yml scanned it
      pip-audit-requirements: ""   # no requirements.txt; the declared dependencies are audited below, as the old ci.yml did
      audit-install-command: pip install pip-audit
      audit-command: |
        python -c 'import tomllib; print("\n".join(tomllib.load(open("pyproject.toml", "rb"))["project"]["dependencies"]))' > "$RUNNER_TEMP/requirements.txt"
        pip-audit --strict --progress-spinner off -r "$RUNNER_TEMP/requirements.txt"
      scorecard: true
      egress-policy: block
      doppler-project: ci
      doppler-config: ci
      doppler-identity-id: ${{ vars.DOPPLER_IDENTITY_ID }}

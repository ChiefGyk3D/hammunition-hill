# CodeQL (Python, the JavaScript in web/, and the workflows themselves),
# gitleaks, Semgrep, dependency review and the dependency audit. The jobs live
# in ChiefGyk3D/git-your-ship-together; this replaces codeql.yml and ci.yml's
# `audit` job.
name: Security

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "41 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  security:
    uses: ChiefGyk3D/git-your-ship-together/.github/workflows/security.yml@0e58a0e61ea8b3800d1cb0e6ed81bb860ace2094 # v1.6.3
    permissions:
      contents: read
      security-events: write   # CodeQL, Semgrep and Trivy-style SARIF uploads
      pull-requests: write     # dependency review's comment
      id-token: write          # Doppler OIDC, when an identity is configured
    secrets:
      DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN }}   # optional Service Token fallback; unset means OIDC only
    with:
      codeql-languages: python,javascript-typescript,actions
      codeql-queries: security-and-quality
      semgrep-config: p/python p/javascript p/github-actions p/secrets
      # Scoped to what this project ships, generated from pyproject so it
      # cannot drift from the real list. Auditing the whole environment would
      # also report advisories against the runner's own pip and setuptools,
      # which we neither ship nor control: a recurring red that everyone
      # learns to ignore is worse than none. So no requirements file for the
      # shared pip-audit step; the command below is the audit.
      pip-audit-requirements: ""
      audit-install-command: pip install --disable-pip-version-check pip-audit
      audit-command: |
        python - <<'PY' > "$RUNNER_TEMP/requirements.txt"
        import pathlib, tomllib
        project = tomllib.loads(pathlib.Path("pyproject.toml").read_text())["project"]
        print("\n".join(project["dependencies"]))
        PY
        cat "$RUNNER_TEMP/requirements.txt"
        pip-audit --strict --progress-spinner off -r "$RUNNER_TEMP/requirements.txt"
      egress-policy: block
      doppler-project: ci
      doppler-config: ci
      doppler-identity-id: ${{ vars.DOPPLER_IDENTITY_ID }}

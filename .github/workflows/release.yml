# Cut a release when a v* tag is pushed; on a pull request, build and check
# everything the release would carry and publish nothing.
#
# The jobs live in ChiefGyk3D/git-your-ship-together's artifact-release.yml:
# build with `build-command`, run `verify-command` against the result, then
# (tags only) write SHA256SUMS, record build provenance, sign every file with
# cosign (keyless) and attach it all to the GitHub release.
#
# The tag is the trigger, and the tag is also the thing most likely to be
# wrong: it is the one input a human types by hand. So verify-command's first
# job is to refuse a tag that disagrees with the tree it points at -- a
# v1.0.0 tag on a package that says 0.9.0, or on a CHANGELOG with no 1.0.0
# section. Publishing that and fixing it afterwards means a version number
# that means two different things depending on where you read it.
#
# artifact-release.yml rather than python-package-release.yml: this release
# carries the wheel, the sdist and the .deb together, and one workflow must
# own the release's single SHA256SUMS. Nothing goes to PyPI.
name: release

on:
  push:
    tags:
      - "v*"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    uses: ChiefGyk3D/git-your-ship-together/.github/workflows/artifact-release.yml@b4dec64ea0efba8b0604339e283adb25da6fd430 # v1.10.0
    permissions:
      # The only writes this repository's CI does outside Security's SARIF
      # upload. tests/test_workflows.py holds the list. The shared workflow
      # keeps its build job at contents: read, so the token that can write to
      # this repository is never present while build dependencies install.
      contents: write       # the GitHub release and its assets
      id-token: write       # keyless signing and build provenance
      attestations: write   # the provenance record
    with:
      publish: ${{ startsWith(github.ref, 'refs/tags/v') }}
      artifacts: dist/*.whl dist/*.tar.gz dist/*.deb
      build-command: |
        set -euo pipefail
        python3 -m venv "$RUNNER_TEMP/build-venv"
        "$RUNNER_TEMP/build-venv/bin/pip" install --disable-pip-version-check build twine
        "$RUNNER_TEMP/build-venv/bin/python" -m build
        "$RUNNER_TEMP/build-venv/bin/twine" check --strict dist/*
        # The docs point operators at the releases page for the .deb, so the
        # release has to carry one. v1.0.0 shipped without it and it had to be
        # attached by hand afterwards; a release that needs a manual step is a
        # release that will one day miss it.
        ./packaging/debian/build.sh dist
        ls -l dist/*.deb
      verify-command: |
        set -euo pipefail
        version="$(python3 -c 'import sys; sys.path.insert(0, "src"); import hammunition_hill; print(hammunition_hill.__version__)')"
        if [ "$GITHUB_REF_TYPE" = tag ]; then
          TAG="$GITHUB_REF_NAME"
          echo "package says $version, tag says $TAG"
          if [ "v$version" != "$TAG" ]; then
            echo "::error::tag $TAG does not match package version $version"
            exit 1
          fi
          if ! grep -q "^## \[$version\]" CHANGELOG.md; then
            echo "::error::CHANGELOG.md has no section for $version"
            exit 1
          fi
        fi
        # `pip install -e .` hides missing package data, and web/ reaches the
        # package through a symlink: a packaging change that stops following
        # it produces a CLI that answers 404 for every file. Install from the
        # artifact, not the tree, and serve from it with no checkout in sight.
        python3 -m venv /tmp/wheeltest
        /tmp/wheeltest/bin/pip install --disable-pip-version-check dist/*.whl
        /tmp/wheeltest/bin/hamhill --version
        mkdir /tmp/bare && cd /tmp/bare
        printf '[server]\nhost = "127.0.0.1"\nport = 8199\n[station]\ncallsign = "N0CALL"\ngrid = "FN31pr"\n' > config.toml
        /tmp/wheeltest/bin/hamhill check --offline --config config.toml | grep -q "site-packages/hammunition_hill/web"
        /tmp/wheeltest/bin/hamhill serve --config config.toml & SERVER=$!
        sleep 3
        curl -fsS -o /dev/null http://127.0.0.1:8199/
        curl -fsS -o /dev/null http://127.0.0.1:8199/app.js
        curl -fsS -o /dev/null http://127.0.0.1:8199/panels/index.json
        kill $SERVER
        cd "$GITHUB_WORKSPACE"
        # The wheel is smoke-tested above in a venv; this is the same promise
        # for the artefact Debian users actually download, on the distribution
        # it targets rather than on the runner's Ubuntu.
        docker run --rm -v "$PWD/dist:/dist:ro" debian:trixie-slim bash -c '
          set -eux
          apt-get update -qq
          apt-get install -y -qq /dist/hammunition-hill_*.deb
          hamhill --version
          hamhill --config /etc/hammunition-hill/config.toml check --offline
        '
      release-notes-command: |
        python3 - <<'PY'
        import os, re
        version = os.environ["VERSION"]
        text = open("CHANGELOG.md", encoding="utf-8").read()
        match = re.search(
            rf"^## \[{re.escape(version)}\].*?$(.*?)(?=^## |\Z)", text, re.M | re.S
        )
        print((match.group(1) if match else "").strip())
        PY
      egress-policy: block
      # pip for the build venv, and the Debian container the verify step pulls and installs into.
      extra-allowed-endpoints: pypi.org:443 files.pythonhosted.org:443 auth.docker.io:443 registry-1.docker.io:443 production.cloudfront.docker.com:443 deb.debian.org:80

  container:
    uses: ChiefGyk3D/git-your-ship-together/.github/workflows/container-release.yml@b4dec64ea0efba8b0604339e283adb25da6fd430 # v1.10.0
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
      security-events: write
    secrets:
      DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN }}   # optional Service Token fallback; unset means OIDC only
    with:
      dockerfile: Dockerfile
      push: ${{ startsWith(github.ref, 'refs/tags/v') }}
      docker-test-command: |
        # Replace with a real check of the image; this only proves it is not root.
        test "$(docker run --rm --entrypoint id "$IMAGE" -u)" != "0"
      egress-policy: block
      doppler-project: ci
      doppler-config: ci
      doppler-identity-id: ${{ vars.DOPPLER_IDENTITY_ID }}

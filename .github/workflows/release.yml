# Publishes on a version tag. The jobs live in ChiefGyk3D/git-your-ship-together.
name: Release

on:
  push:
    tags: ['v*']
  pull_request:   # builds and checks; never publishes
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    uses: ChiefGyk3D/git-your-ship-together/.github/workflows/python-package-release.yml@0e58a0e61ea8b3800d1cb0e6ed81bb860ace2094 # v1.6.3
    permissions:
      contents: write      # the GitHub release and its assets
      id-token: write      # PyPI Trusted Publishing, and build provenance
      attestations: write  # the provenance record
    with:
      publish: ${{ startsWith(github.ref, 'refs/tags/v') }}
      pypi: false   # turn on once a Trusted Publisher on PyPI names this repository, release.yml and the pypi environment
      smoke-command: hamhill --help
      verify-command: grep -q "^## \[$VERSION\]" CHANGELOG.md
      egress-policy: block

  container:
    uses: ChiefGyk3D/git-your-ship-together/.github/workflows/python-docker-release.yml@0e58a0e61ea8b3800d1cb0e6ed81bb860ace2094 # v1.6.3
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
      security-events: write
    secrets:
      DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN }}   # optional Service Token fallback; unset means OIDC only
    with:
      dockerfile: Dockerfile
      push: ${{ startsWith(github.ref, 'refs/tags/v') }}
      docker-test-command: |
        # Replace with a real check of the image; this only proves it is not root.
        test "$(docker run --rm --entrypoint id "$IMAGE" -u)" != "0"
      egress-policy: block
      doppler-project: ci
      doppler-config: ci
      doppler-identity-id: ${{ vars.DOPPLER_IDENTITY_ID }}

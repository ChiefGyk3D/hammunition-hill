# Cut a release when a v* tag is pushed.
#
# The tag is the trigger, and the tag is also the thing most likely to be
# wrong: it is the one input a human types by hand. So the first job's whole
# purpose is to refuse a tag that disagrees with the tree it points at -- a
# v1.0.0 tag on a package that says 0.9.0, or on a CHANGELOG with no 1.0.0
# section. Publishing that and fixing it afterwards means a version number
# that means two different things depending on where you read it.
#
# No third-party actions here beyond checkout and setup-python. The release is
# created with `gh`, which is already on the runner: one fewer supply-chain
# dependency in the job that has write permission is worth a few lines of
# shell.
name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  verify:
    name: the tag agrees with the tree
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - name: the tag, the package and the changelog must agree
        id: version
        env:
          # Through the environment, never interpolated into the script: a tag
          # is attacker-controllable in the general case, and $GITHUB_REF_NAME
          # pasted into a shell line is the classic injection in this file.
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          version="$(python -c 'import sys; sys.path.insert(0, "src"); import hammunition_hill; print(hammunition_hill.__version__)')"
          echo "package says $version, tag says $TAG"
          if [ "v$version" != "$TAG" ]; then
            echo "::error::tag $TAG does not match package version $version"
            exit 1
          fi
          if ! grep -q "^## \[$version\]" CHANGELOG.md; then
            echo "::error::CHANGELOG.md has no section for $version"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

  build:
    name: wheel, sdist and checksums
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - run: pip install --disable-pip-version-check build twine
      - run: python -m build
      - run: python -m twine check --strict dist/*
      - name: the wheel must actually serve the dashboard
        # A wheel that installs and cannot serve is the failure this project
        # has already had once: web/ reaches the package through a symlink,
        # and a packaging change that stops following it produces a CLI that
        # answers 404 for every file. Install from the artifact, not the tree.
        run: |
          set -euo pipefail
          python -m venv /tmp/relcheck
          /tmp/relcheck/bin/pip install --disable-pip-version-check dist/*.whl
          /tmp/relcheck/bin/hamhill --version
          cp config.example.toml /tmp/relcheck-config.toml
          /tmp/relcheck/bin/hamhill --config /tmp/relcheck-config.toml check --offline
      - name: the Debian package, from the same tree
        # The docs point operators at the releases page for the .deb, so the
        # release has to carry one. v1.0.0 shipped without it and it had to be
        # attached by hand afterwards -- the checksums were regenerated over
        # all three artefacts at the same time, but a release that needs a
        # manual step is a release that will one day miss it.
        run: |
          set -euo pipefail
          ./packaging/debian/build.sh dist
          ls -l dist/*.deb
      - name: the package installs and serves in a Debian container
        # The wheel is smoke-tested above in a venv; this is the same promise
        # for the artefact Debian users actually download, on the distribution
        # it targets rather than on the runner's Ubuntu.
        run: |
          set -euo pipefail
          docker run --rm -v "$PWD/dist:/dist:ro" debian:trixie-slim bash -c '
            set -eux
            apt-get update -qq
            apt-get install -y -qq /dist/hammunition-hill_*.deb
            hamhill --version
            hamhill --config /etc/hammunition-hill/config.toml check --offline
          '
      - name: checksums
        run: |
          set -euo pipefail
          cd dist
          sha256sum ./* > SHA256SUMS
          cat SHA256SUMS
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  publish:
    name: publish the release
    needs: [verify, build]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      # The one write in this repository's CI outside CodeQL, and the reason
      # this workflow exists. tests/test_workflows.py holds the list.
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # v7 to match the upload-artifact major CI already pins. Mixing majors
      # across the artifact hand-off is the kind of thing that works until
      # the release you actually need it for.
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: dist
          path: dist
      - name: create the release from the changelog section
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          VERSION: ${{ needs.verify.outputs.version }}
        run: |
          set -euo pipefail
          python - <<'PY' > notes.md
          import os, re
          version = os.environ["VERSION"]
          text = open("CHANGELOG.md", encoding="utf-8").read()
          match = re.search(
              rf"^## \[{re.escape(version)}\].*?$(.*?)(?=^## |\Z)", text, re.M | re.S
          )
          print((match.group(1) if match else "").strip())
          PY
          gh release create "$TAG" dist/* --title "$TAG" --notes-file notes.md --verify-tag

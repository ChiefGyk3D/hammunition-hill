# Static analysis for both languages that ship. ruff's flake8-bandit rules
# already cover a lot on the Python side; CodeQL adds dataflow analysis, which
# is the part a pattern matcher cannot do -- and the JavaScript in web/ has no
# other automated security review at all.
name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "41 5 * * 1"

permissions:
  contents: read

jobs:
  analyze:
    name: analyze ${{ matrix.language }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      security-events: write   # the only write this repository's CI does
      contents: read
    strategy:
      fail-fast: false
      matrix:
        language: [python, javascript-typescript]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@a35ac6e6798d72df5475948b28efb89edc2e19ca # v4.37.9
        with:
          # `languages`, plural. The singular form is silently ignored --
          # the action then auto-detects and builds a database for every
          # language in each matrix leg, doubling the work and analysing
          # the wrong thing.
          languages: ${{ matrix.language }}
          queries: security-and-quality
      - uses: github/codeql-action/analyze@a35ac6e6798d72df5475948b28efb89edc2e19ca # v4.37.9
        with:
          category: /language:${{ matrix.language }}

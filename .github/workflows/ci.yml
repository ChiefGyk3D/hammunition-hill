# The generic legs (ruff, the pytest matrix, the smoke test, the container
# build, the workflow lint) are ChiefGyk3D/git-your-ship-together's
# python-ci.yml; its `CI green` job is reported here as `ci / CI green`.
# What stays in this file is what a shared workflow cannot express: a real
# browser against the dashboard, a Debian container that installs the .deb,
# and the weekly check that upstream hosts still answer. `all-green` ("all
# checks passed") covers all of them, `ci` and `shell` included.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Upstream endpoints rot and dependencies grow advisories on their own
  # schedule, not ours. A weekly run catches that without anyone pushing.
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

# Read-only by default. No job here needs to write to the repository, and a
# workflow that cannot write cannot be turned into one that does by a PR.
permissions:
  contents: read

# A new push supersedes the previous run for the same ref. Never cancel main:
# its results are the record of what actually shipped.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  PYTHONUNBUFFERED: "1"
  # Turn warnings into a visible signal rather than scrollback.
  PYTHONWARNINGS: "default"
  FORCE_COLOR: "1"

jobs:
  ci:
    uses: ChiefGyk3D/git-your-ship-together/.github/workflows/python-ci.yml@bcd2cf02a7dfc353d084ffd9c4d7ccd00b5f25c7 # v1.18.0
    permissions:
      contents: read
      id-token: write   # Doppler OIDC, when an identity is configured; python-ci keeps it off the test job
    secrets:
      DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN }}   # optional Service Token fallback; unset means OIDC only
    with:
      python-versions: '["3.11", "3.12", "3.13"]'
      # The primary deployment target is a Raspberry Pi, so the ARM runner is
      # not exotic here; a shack laptop is as likely to be a Mac, and that is
      # where path and filesystem assumptions surface. Every version runs on
      # every runner: the shared workflow takes a cross product.
      runners: '["ubuntu-24.04", "ubuntu-24.04-arm", "macos-14"]'
      install-command: pip install --disable-pip-version-check -e ".[dev]"
      # -W error promotes DeprecationWarnings to failures. A warning ignored
      # for three releases becomes a breakage on the fourth.
      test-command: pytest -q --durations=10 -W error::DeprecationWarning
      lint-install-command: pip install --disable-pip-version-check "ruff>=0.5"
      # `ruff format --check` is enforced, with the data tables in prefix.py,
      # severity.py and bands.py fenced off by `# fmt: off`: those are data,
      # laid out as tables because that is how they are read and reviewed.
      lint-command: |
        ruff check --output-format=github src/ tests/ fuzz/ .github/scripts/
        ruff format --check src/ tests/ fuzz/ .github/scripts/
      smoke-install-command: pip install --disable-pip-version-check .
      # Two checks that used to be two jobs, both of which need only the
      # installed package: the file every new user copies still validates,
      # and the collector -> snapshot -> HTTP loop closes against a local
      # upstream (so a green run does not depend on NOAA's uptime).
      #
      # --offline skips DNS: resolving ten upstream hostnames would make every
      # PR depend on NOAA's resolver, and a red build for that reason teaches
      # people to ignore red builds. The live check is `upstreams`, below.
      # Run from the checkout, because that is what INSTALL.md tells people to
      # do: clone, copy the example, run it.
      smoke-command: |
        hamhill --version
        hamhill --help
        cp config.example.toml ci-config.toml
        hamhill check --offline --config ci-config.toml
        # With no web/ beside the config, check must succeed and must say it
        # is serving the packaged copy, not a missing local one.
        scratch="$(mktemp -d)"
        cp config.example.toml "$scratch/config.toml"
        (cd "$scratch" && hamhill check --offline --config config.toml | tee "$scratch/check.out")
        grep -q "hammunition_hill/web" "$scratch/check.out"
        python .github/scripts/smoke.py
      dockerfile: Dockerfile
      # The bare-install property, proven for the artifact people deploy: a
      # config mount, a data volume, the dashboard answering on its port.
      docker-test-command: |
        mkdir -p /tmp/hh-docker
        printf '[server]\nhost = "0.0.0.0"\nport = 8073\n[station]\ncallsign = "N0CALL"\ngrid = "FN31pr"\n' > /tmp/hh-docker/config.toml
        docker run -d --name hamhill -p 127.0.0.1:8073:8073 \
          -v /tmp/hh-docker/config.toml:/config/config.toml:ro "$IMAGE"
        for i in $(seq 1 20); do
          curl -fsS -o /dev/null http://127.0.0.1:8073/ && break
          sleep 1
        done
        curl -fsS -o /dev/null http://127.0.0.1:8073/
        curl -fsS -o /dev/null http://127.0.0.1:8073/app.js
        curl -fsS -o /dev/null http://127.0.0.1:8073/panels/index.json
        curl -fsS http://127.0.0.1:8073/data/morse.json | grep -q q_codes
        docker logs hamhill 2>&1 | grep -qi "dashboard on"
        timeout 15 docker stop hamhill
        docker rm hamhill
      egress-policy: block

  fuzz:
    # python-fuzz.yml runs every Atheris target under fuzz/ for a fixed time and
    # fails on a crash, uploading the input that caused it. Short on a pull
    # request (30 s each, enough to catch a regression a target already knows
    # how to find) and long on the weekly schedule above (600 s each, which is
    # where new findings come from). It is the same job either way, so there is
    # one place to read the targets' results and one name for the merge gate.
    uses: ChiefGyk3D/git-your-ship-together/.github/workflows/python-fuzz.yml@bcd2cf02a7dfc353d084ffd9c4d7ccd00b5f25c7 # v1.18.0
    permissions:
      contents: read
    with:
      seconds-per-target: ${{ github.event_name == 'schedule' && 600 || 30 }}
      # Seven targets run one after another: 7 x 600 s is 70 minutes of fuzzing.
      timeout-minutes: ${{ github.event_name == 'schedule' && 90 || 30 }}
      # The hash-checked runtime lock (it includes the satellites extra, so the
      # element-set target also reaches the propagator), then the project itself.
      install-command: |
        pip install --disable-pip-version-check --require-hashes -r requirements/runtime.txt
        pip install --disable-pip-version-check --no-deps -e .
      egress-policy: block

  shell:
    # bash-ci.yml over the packaging scripts (build.sh, postinst, prerm).
    uses: ChiefGyk3D/git-your-ship-together/.github/workflows/bash-ci.yml@bcd2cf02a7dfc353d084ffd9c4d7ccd00b5f25c7 # v1.18.0
    permissions:
      contents: read
    with:
      runners: '["ubuntu-24.04", "ubuntu-24.04-arm"]'
      shfmt-args: -i 2 -ci   # the packaging scripts are written with two spaces
      shfmt-continue-on-error: true   # Pre-existing drift in build.sh, postinst and prerm (continuation-line alignment, `a|b` spacing), reported rather than failed until the scripts are reformatted
      workflow-lint: false   # the ci job above already lints the workflow files
      egress-policy: block

  frontend:
    name: browser render
    # Local: it needs `playwright install --with-deps`, which is apt as root,
    # and the shared workflows run with sudo disabled by design.
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
      - run: |
          pip install --disable-pip-version-check --require-hashes -r requirements/runtime.txt
          pip install --disable-pip-version-check --no-deps .
      - name: install playwright and chromium
        # Both are needed and they are different things: `npm ci` puts the
        # module, at the version and hash package-lock.json pins, where the
        # driver's require() can find it, and `playwright install` fetches the
        # matching browser build. Installing only the browser leaves the driver
        # unable to import the library that drives it.
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npx playwright install --with-deps chromium
      - name: every dashboard renders without a console error
        # The checks pytest cannot do: that the panels actually load, that no
        # module throws, and that nothing on the page tries to reach a host the
        # CSP did not name.
        run: python .github/scripts/render_check.py
      - name: upload screenshots
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dashboard-screenshots
          path: /tmp/hamhill-render/*.png
          if-no-files-found: warn
          retention-days: 7

  debian:
    name: debian package installs and serves
    # Local: a Debian container *job*, because the package's promises are
    # about a Debian filesystem: the service account, the conffile, the state
    # directory, and the dependency names. Testing it on the runner's own
    # Ubuntu would test a different set of package names. The shared
    # workflows' `distros` input runs a test suite in an image; it does not
    # install a package into one.
    #
    # This job exists because the first build of this package crash-looped on
    # a real install -- data_dir resolved under /etc, which the unit makes
    # read-only -- and nothing in the tree could have caught that.
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    container:
      image: debian:trixie-slim
      # The service is exercised with hamhill directly rather than systemd,
      # which does not run in a container. The systemd unit is checked
      # statically by tests/test_packaging.py and by hand on a real machine.
      options: --user root
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: build the package
        run: |
          set -eux
          apt-get update -qq
          apt-get install -y -qq --no-install-recommends python3 dpkg-dev gzip
          ./packaging/debian/build.sh dist
          ls -l dist/*.deb
      - name: install it, dependencies and all
        run: |
          set -eux
          apt-get install -y -qq ./dist/hammunition-hill_*.deb
          hamhill --version
      - name: the installed package serves the dashboard
        # Straight from /usr/bin with the shipped /etc config: this is the
        # path an operator gets, including the data_dir the package rewrites.
        run: |
          set -eux
          hamhill --config /etc/hammunition-hill/config.toml check --offline
          hamhill --config /etc/hammunition-hill/config.toml serve &
          for _ in $(seq 1 30); do
            python3 -c "import urllib.request;urllib.request.urlopen('http://127.0.0.1:8073/',timeout=2)" && break
            sleep 1
          done
          python3 - <<'PY'
          import urllib.request
          for path in ("", "app.js", "panels/index.json", "data/morse.json"):
              url = f"http://127.0.0.1:8073/{path}"
              body = urllib.request.urlopen(url, timeout=5).read()
              assert body, f"{url} served nothing"
              print(f"{url}: {len(body)} bytes")
          PY
      - name: the snapshots landed where the package says they do
        run: |
          set -eux
          test -d /var/lib/hammunition-hill
          find /var/lib/hammunition-hill -maxdepth 1 | head
          test -s /var/lib/hammunition-hill/morse.json

  upstreams:
    name: upstream hosts still resolve
    # Local: the shared workflows are deliberately offline-testable. Schedule
    # and manual only, so it must never be able to fail somebody's pull
    # request -- but a weekly signal that an upstream host has vanished is
    # exactly what this project needs, because the alternative is finding out
    # from a blank panel months later.
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - run: |
          pip install --disable-pip-version-check --require-hashes -r requirements/runtime.txt
          pip install --disable-pip-version-check --no-deps .
      - name: fetch and parse every source in the example config
        # --fetch, not a bare check: resolving a name proves DNS works, which
        # is not the thing that rots. An upstream keeps its hostname and its
        # certificate for years while renaming a JSON field, and the only
        # signal is a panel that quietly goes empty. This runs the real
        # client, guard and parser once per source.
        run: |
          cd "$GITHUB_WORKSPACE"
          cp config.example.toml config.toml
          hamhill check --config config.toml --fetch

  # The local aggregate: the shared `ci / CI green` covers only what the shared
  # workflow ran, and branch protection needs the local jobs counted too.
  all-green:
    name: all checks passed
    if: always()
    needs: [ci, fuzz, shell, frontend, debian]
    # `upstreams` is deliberately absent: it is schedule-only and talks to
    # the real internet, so it must never gate a merge.
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: verify every job succeeded
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          echo "$NEEDS"
          if echo "$NEEDS" | grep -qE '"result": *"(failure|cancelled|skipped)"'; then
            echo "::error::at least one job did not succeed"
            exit 1
          fi
          echo "all jobs succeeded"

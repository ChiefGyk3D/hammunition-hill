version: 2
updates:
  # Workflow actions are pinned to commit SHAs, which is the right thing for
  # supply-chain reasons and means they never update on their own. Dependabot
  # is what stops "pinned" from quietly becoming "abandoned".
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    commit-message:
      prefix: "ci"
    groups:
      actions:
        patterns: ["*"]

  # Two runtime dependencies, both chosen on security grounds. An advisory in
  # either matters more here than a version bump usually does.
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    commit-message:
      prefix: "deps"
